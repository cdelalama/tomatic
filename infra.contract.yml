# infra.contract.yml — Project contract for home-infra-protocol
#
# Spec:    ~/src/home-infra-protocol/SPEC.md
# Format:  ~/src/home-infra-protocol/docs/PROJECT_CONTRACTS.md
# Schemas: ~/src/home-infra-protocol/schemas/
#
# As of 2026-05 this file is OPTIONAL and EXPERIMENTAL. The portal does
# not consume it yet; ~/src/home-infra/catalog/services.yml remains the
# authoritative input for portal rendering. Filling this contract
# validates the protocol shape on a real project.

id: tomatic
name: Tomatic
repository: https://github.com/cdelalama/tomatic

# Services land hit by hit. Until V1.0-kernel reaches H10–H11 these are
# planned, not deployed. Update this file when the corresponding
# container actually runs on the NAS.
services:
  - id: tomatic-web
    name: Tomatic Operator Web
    url: http://10.0.0.220:3001            # planned, internal-only on NAS
    deps: [mosquitto]                      # shared broker on `zigbee` RPi (home-infra ADR-0011)
    # Edge route will be added when the public dashboard ships in V1.2.

  - id: tomatic-public-dashboard
    name: Tomatic Public Dashboard
    url: https://tomatic.lamanoriega.com   # planned for V1.2 via edge-caddy
    deps: [mosquitto]
    # Static DNS record + edge-caddy vhost will be added at H18.

  - id: tomatic-esphome-builder
    name: Tomatic ESPHome Builder
    url: http://10.0.0.220:6052            # planned, internal-only

runtime: docker

deploy:
  host: nas                                 # primary target per source doc §13 (NAS-first)
  method: docker-save-load                  # build on dev-vm, transfer to NAS
  compose: /share/Container/compose/tomatic/

# MQTT topology — see home-infra ADR-0011 (2026-05-02) and project ADR D-010.
# Tomatic does NOT run its own broker. It reuses the existing shared
# Mosquitto on the `zigbee` RPi (10.0.0.139:1883), which is the only
# MQTT broker on the homelab. The `tomatic-bridge` runs a single MQTT
# client and uses the same broker for both `tomatic/<cabinet>/+` topics
# and `zigbee2mqtt/+/set` commands targeting Sonoff T2 actuators —
# no cross-broker plumbing is needed.
mqtt:
  broker_host: zigbee.home.arpa             # 10.0.0.139:1883
  broker_service_id: mosquitto              # references catalog/services.yml in home-infra
  user: tomatic_bridge                      # to be provisioned at H1; ACL on `zigbee` RPi
  acl_topics_publish:
    - "tomatic/+/commands/+/request"
    - "zigbee2mqtt/+/set"
    - "tomatic/+/agent/+"
  acl_topics_subscribe:
    - "tomatic/+/sensors/#"
    - "tomatic/+/commands/+/ack"
    - "tomatic/+/alerts/#"
    - "zigbee2mqtt/+"

runbooks:
  rebuild: docs/operations/DEPLOY_PLAYBOOK.md     # links to ~/src/home-infra/docs/CONVENTIONS.md
  restore: TODO                                    # litestream restore + ESPHome OTA recovery — fill at H11
  verify:  TODO                                    # smoke-test playbook — fill at H11
  rollback: TODO                                   # docker compose pull <previous tag> + bridge db rollback — fill at H11

secret_refs:
  # All values live in Doppler. Project `tomatic`, config `dev` (to be
  # created at H10). Values are never committed.
  MQTT_PASSWORD:        doppler://tomatic/dev/MQTT_PASSWORD
  ADMIN_PASSWORD:       doppler://tomatic/dev/ADMIN_PASSWORD
  ANTHROPIC_API_KEY:    doppler://tomatic/dev/ANTHROPIC_API_KEY
  OTA_PASSWORD:         doppler://tomatic/dev/OTA_PASSWORD
  WIFI_SSID:            doppler://tomatic/dev/WIFI_SSID
  WIFI_PASSWORD:        doppler://tomatic/dev/WIFI_PASSWORD
  TELEGRAM_BOT_TOKEN:   doppler://tomatic/dev/TELEGRAM_BOT_TOKEN
  TELEGRAM_CHAT_ID:     doppler://tomatic/dev/TELEGRAM_CHAT_ID
